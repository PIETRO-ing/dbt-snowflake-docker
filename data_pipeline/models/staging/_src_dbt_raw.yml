sources:
  - name: source
    database: dbt_raw
    schema: source
    tables:
      - name: dim_customer
        columns:
          - name: customer_sk
            data_tests:
              - unique
              - not_null
          - name: customer_code
            data_tests:
              - unique
              - not_null

      - name: dim_date
        columns: 
          - name: date_sk
            data_tests: 
              - unique
              - not_null

      - name: dim_product
        columns:
          - name: product_sk
            data_tests:
              - unique
              - not_null
          - name: product_code
            data_tests:
              - unique
              - not_null

      - name: dim_store
        columns:
          - name: store_sk
            data_tests:
              - unique
              - not_null

          - name: store_name
            data_tests:
              - accepted_values:
                  values: ['MegaMart Manhattan', 'MegaMart Brooklyn', 'MegaMart Austin', 'MegaMart San Jose', 'MegaMart Toronto']

      - name: fact_returns
        columns: 
          - name: sales_id
            data_tests: 
              - unique
              - not_null

      - name: fact_sales
        columns:
          - name: store_sk
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: ref('stg_store')
                    field: store_sk
          - name: gross_amount
            data_tests:
              - generic_non_negative
        